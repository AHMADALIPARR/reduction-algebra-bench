    <text x="290" y="118" text-anchor="middle" fill="#f472b6" font-weight="bold">Goldilocks field</text>
    <text x="290" y="138" text-anchor="middle" fill="#8b98b8">p = 2&#8310;&#8308; &#8722; 2&#179;&#178; + 1</text>
